# Settings for the whole pipeline.
# Change things here instead of in the code.

data:
  bucket_name: aipi510-boston-marathon      # Google Cloud Storage bucket
  version: 1                                # which version of the cleaned data to use

features:
  categorical: [gender]
  # One model is trained for each list below. Runners don't always know all three
  # of their checkpoint times, so the API picks the model that matches the times
  # it was given. Everything else about the models is the same.
  numeric:
    all_splits: [age, split_5k, split_10k, split_half, slowdown]
    half_only: [age, split_half]
    10k_only: [age, split_10k]
    5k_only: [age, split_5k]

target: finish_time     # finish time in minutes

split:
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

model:
  type: random_forest     # random_forest or linear_regression
  n_estimators: 100       # only used by random_forest
  max_depth: 10           # only used by random_forest

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: boston-marathon-finish-time

# Each model gets its own folder: models/all_splits/, models/half_only/, ...
output:
  model_dir: models
  model_file: model.joblib
  metrics_file: metrics.json
  plot_file: predicted_vs_actual.png
