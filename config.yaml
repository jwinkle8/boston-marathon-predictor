# Settings for the whole pipeline.
# Change things here instead of in the code.

data:
  bucket_name: aipi510-boston-marathon      # Google Cloud Storage bucket
  version: 1                                # which version of the cleaned data to use

features:
  numeric: [age, split_5k, split_10k, split_half, slowdown]
  categorical: [gender]

target: finish_time     # finish time in minutes

split:
  test_size: 0.15
  val_size: 0.15
  random_seed: 42

model:
  type: random_forest     # random_forest or linear_regression
  n_estimators: 100       # only used by random_forest
  max_depth: 10           # only used by random_forest

mlflow:
  tracking_uri: sqlite:///mlflow.db
  experiment_name: boston-marathon-finish-time

output:
  model_path: models/model.joblib
  metrics_path: models/metrics.json
  plot_path: models/predicted_vs_actual.png
